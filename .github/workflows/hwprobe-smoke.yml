name: hwprobe-smoke

# pf-hwprobe headless CI smoke gate (bead tsp-fr2n.7 / wires infra-106 E7).
#
# Runs the SAME descriptor-generic matrix E5's sim-gate.yml runs against
# hwprobe-lite (the reference payload), but with pf-hwprobe.arm64 as the app
# under test. Two descriptors (a133, a523) = two matrix rows with ZERO
# app/test-code difference — the a133/a523 delta is DATA (E1's
# capabilities.toml), same source, same binary.
#
# BLOCKING (infra-113 B2, flipped 2026-07-26): this `hwprobe-smoke` job is now a REQUIRED
# status check on main — a red run BLOCKS merge. Same posture as the E5 sim-gate. The a133
# row is the blocking key (a523 runs non-blocking, infra-113 D2 descope). Required via the
# repo-level ruleset `pf-hwprobe-smoke required check` (id 19755681), scoped to this repo's
# default branch only (NOT the org-wide pf-pr-review ruleset). See the "GATE SCOPE / POSTURE
# / FORK-SKIP" block below for the full contract before relying on this gate.
#
# ═══════════ GATE SCOPE · HONESTY CONTRACT · POSTURE · FORK-SKIP (infra-113 B1) ═══════════
# WHAT THIS GATE PROVES — the LOGICAL layer ONLY (canonical: sim/docs/HONESTY-CONTRACT.md;
# restated in every gate's docs per infra-113 §4).
# ADD A DEVICE = ADD DATA — this gate's device rows + posture come from platform/ci-matrix.toml;
# adding a device is a pure data change (descriptor + .scad skin + posture row), NOT a workflow
# edit. Cold-start walkthrough: sim/docs/ADD-A-DEVICE.md.
# It runs the SAME descriptor-generic
# check-control matrix the sim-gate runs, with pf-hwprobe.arm64 as the app under test:
# descriptor correctness, input mapping (evdev codes → SDL3), capability/permission
# semantics, graceful missing-hardware degradation, and per-variant coverage (a133 vs
# a523 = data, not code) — cheaply, off-hardware, in CI.
#
# WHAT IT IS **NOT** HONEST ABOUT — these FIVE things are NOT proven here and a green run
# MUST NOT be read as covering them; they stay the flash → serial → webcam HARDWARE gate's
# SOLE authority (the two gates are complementary, never substitutes):
#   1. GPU blobs — the closed PowerVR UM/KM and the dc_sunxi → DE2.0 → fb0 path are not
#      reproduced; a sim "cube renders" proves NOTHING on-device.
#   2. Real WiFi flakiness — the XR819/xr829 lossy-link reality (DHCP-up-but-TCP-dead)
#      cannot be mocked faithfully; network E2E stays on hardware.
#   3. Timing / perf / thermal — qemu-user timing ≠ A53/A55; no soak, no fan/thermal.
#   4. Isolation / enforcement — guest seccomp is unenforceable under qemu-user; the sim
#      proves the capability/permission CONTRACT + ergonomics, NOT that a hostile app is
#      confined.
#   5. Per-SoC graphics — divergent display stacks (A133 sunxifb/no-KMS/fb0 vs A523
#      kmsdrm/Mali/DRM-KMS) are per-SoC code + build, not descriptor data.
#   (This gate additionally has a KNOWN local gap: the native/qemu PARITY leg is SKIPPED —
#   pf-hwprobe's build.sh cross-builds arm64 only — so it proves the arm64/qemu leg only,
#   loudly, not silently. See "WHY qemu-launcher ONLY" below; tracked in tsp-78ta item 3.)
#
# POSTURE (infra-113 D3/D4) — BLOCKING as of 2026-07-26 (Phase B2 flip): this job IS a
# required status check on main, so a red run BLOCKS merge. a133 is the blocking key; a523
# runs non-blocking (D2 — a523 rides as device-free data, not a hardware gate). The flip was
# gated on currency (D3): A1 refreshed the sim/platform baselines, A2 refreshed this repo's
# coherent sim+platform pin pair (smoke green all devices), and a negative control —
# descriptor-row deletion → red — was demonstrated first (infra-113 B1; hwprobe-smoke run
# 30186739722 conclusion=failure). Required via the repo-level ruleset `pf-hwprobe-smoke
# required check` (id 19755681, default-branch only), which carries an OrgAdmin `always`
# bypass (owner break-glass for a runner outage / flake — mirrors the pf-pr-review
# check-ruleset; grants no direct-push path, pf-require-pr stays bypass-free). It does NOT
# touch the org-wide pf-pr-review ruleset (18463042) — this check is scoped to this repo only.
#
# FORK-SKIP SEMANTICS (infra-113 finding 10 / D4 — stated plainly): the job-level fork guard
# below makes this job SKIP for any PR whose head repo is not this repository. GitHub treats
# a SKIPPED required check as SATISFIED — so now that B2 has made this a required check
# (2026-07-26), a fork PR's skip counts as a pass and this gate does NOT actually gate fork
# PRs. That is an accepted, conscious decision (finding 10 / D4, ACCEPTED at the B2 flip):
# the build-lab confinement invariant (tsp-20u1) forbids executing
# fork/public-PR code on this self-hosted docker = host-root runner, so a fork PR cannot run
# the suite here by design. Fork contributions are validated by an org member re-pushing the
# change to an in-repo branch (which DOES run the gate) before merge.
# ═════════════════════════════════════════════════════════════════════════════════════════
#
# WHY qemu-launcher ONLY (for now):
#   pf-hwprobe's build.sh currently cross-builds ONLY aarch64. Sim's
#   check-control.py's parity check needs a matching x86 native build to
#   compare bit-for-bit against qemu. Until pf-hwprobe grows an x86 build
#   step, --only-launcher qemu drives just the arm64/qemu leg (loudly, not
#   silently — the transcript prints "parity SKIPPED"). Adding x86 is a
#   straightforward follow-up (mirror the arm64 recipe with
#   x86_64-linux-gnu-gcc + x86 SDL3 build); tracked in ci/check-control-
#   hwprobe.py's module docstring.
#
# SECURITY POSTURE — identical to E5 sim-gate.yml (self-hosted docker with
# elevated caps for qemu-tsp + uinput + bwrap). The equivalent hardenings
# apply here:
#   * Least-privilege GITHUB_TOKEN (contents: read).
#   * --network none on the RUN phase (baked, pinned artifacts).
#   * MECHANICAL fork guard (tsp-20u1, build-lab confinement invariant): the
#     job-level `if:` skips the job for any PR whose head repo is not this
#     repository, so even a maintainer-APPROVED fork PR never executes on the
#     runner. The org approval gate (fork-pr-contributor-approval =
#     all_external_contributors) stays as defense-in-depth beneath it.
#     Canonical doc: mission-control BUILD_PIPELINE.md "Build-lab confinement
#     invariant".
#
# RUNNER NOTE: this gate runs on the self-hosted builder VM (org runner
# `mm-build-vm`, label pf-builder-vm; a KVM guest on modelmaker, OFF the
# labgrid arbitration host per infra-113 Option B, tsp-65jc.24). It is
# org-authored-only with the SAME confinement posture as the retired Dell
# `trimui-build-lab` target — the fork-skip guard above is unchanged.
# Runner-group membership (the build-lab group today; moving to a dedicated
# public-repo-scoped `pf-builder` group in the same bead) is an owner/org-
# admin action.

on:
  pull_request:
    branches: [main]
  # Baseline signal on main (bead tsp-u3e4): one smoke run per merge is cheap on
  # the self-hosted runner and gives main a green/red history instead of
  # PR-only signal — a prerequisite for ever flipping advisory -> blocking.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hwprobe-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hwprobe-smoke:
    # Build-lab confinement invariant (tsp-20u1): this self-hosted runner has
    # docker = host root and must NEVER execute fork/public-PR code — skip the
    # job whenever the PR head is not this repository, so even an APPROVED
    # fork PR never runs here. push/workflow_dispatch are unaffected (org-
    # authored by construction). Advisory check, so a skip blocks nobody.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 60
    env:
      SIM_IMG: pocketforge-sim:hwprobe-smoke-${{ github.run_id }}
      # sim commit that sim-gate.yml also builds against; kept in step with
      # pf-hwprobe's build.sh SIM_COMMIT so the sim's control_surface + the
      # check-control matrix + the qemu-tsp + rootfs all come from ONE ref.
      SIM_REPO: https://github.com/pocketforge-os/sim.git
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # uinput note: the nested sim needs the HOST's /dev/uinput (passed into the
      # container below). The runner user has no modprobe sudo, so a workflow-side
      # `sudo modprobe uinput` can never work — the module is guaranteed host-side
      # via /etc/modules-load.d/uinput.conf, provisioned by pocketforge-automation
      # scripts/provision-build-host.sh (bead tsp-y1c6). No workflow step needed.

      - name: Cross-build pf-hwprobe.arm64 (pinned; hermetic docker)
        run: ./build.sh

      - name: Assert arm64 ELF built
        run: |
          file build/pf-hwprobe.arm64 | tee /tmp/pf-hwprobe.file
          grep -q 'ELF 64-bit LSB executable, ARM aarch64' /tmp/pf-hwprobe.file

      - name: Resolve pinned sim commit from pf-hwprobe pins.env
        id: sim
        run: |
          # shellcheck disable=SC1091
          . ./pins.env
          echo "sim_commit=${SIM_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "resolved sim commit: ${SIM_COMMIT}"

      - name: Clone the sim @ pinned commit
        run: |
          rm -rf .cache/sim-clone
          git clone --quiet "$SIM_REPO" .cache/sim-clone
          git -C .cache/sim-clone -c advice.detachedHead=false checkout --quiet "${{ steps.sim.outputs.sim_commit }}"

      - name: Build the sim's pocketforge-sim image (baked qemu-tsp + rootfs + platform + hwprobe-lite)
        run: |
          docker build -t "$SIM_IMG" .cache/sim-clone

      # Data-driven device matrix (infra-113 B4 / D6): the device list + per-device posture are
      # derived from the baked platform's ci-matrix.toml (`pf-sim matrix`), NOT a hardcoded
      # hardcoded device list — so adding a device to CI is a platform-data change, not an edit here.
      # a133 is the blocking key (a failure fails this required `hwprobe-smoke` check → merge block);
      # a523 runs advisory (a failure is reported but does not fail the check); excluded devices
      # never run. A new descriptor auto-joins as advisory with zero edits here.
      - name: Derive the data-driven device matrix from the baked platform
        id: matrix
        run: |
          set -euo pipefail
          # Read the CI gate matrix from the platform descriptors BAKED into the sim image
          # (ci-matrix.toml, infra-113 B4). We invoke caps.py via the always-present `shell` verb
          # (this image is built from pins.env's pinned sim, which need not carry the new `matrix`
          # entrypoint verb) — so the only dependency is the BAKED PLATFORM carrying caps.py's
          # `matrix` subcommand.
          caps() { docker run --rm "$SIM_IMG" shell -lc "python3 /opt/pf/platform/core/caps.py $*" 2>/dev/null; }
          blocking="$(caps matrix list --posture blocking --format ids || true)"
          advisory="$(caps matrix list --posture advisory --format ids || true)"
          excluded="$(caps matrix list --posture excluded --format ids || true)"
          if [ -z "${blocking}${advisory}" ]; then
            # FAIL-CLOSED fallback: the baked platform predates infra-113 B4 (no ci-matrix.toml /
            # no `caps matrix`). Derive the device list from platform data anyway — `caps list`
            # (long-standing) yields the descriptor'd devices — and gate them ALL as blocking (the
            # pre-B4 behavior), so a stale pin never SILENTLY relaxes a device. Still list-free.
            blocking="$(caps list | tr '\n' ' ' | sed 's/ *$//')"; advisory=""; excluded=""
            echo "note: baked platform has no ci-matrix.toml (pin predates infra-113 B4) — all descriptor'd devices treated BLOCKING until the pin catches up"
          fi
          echo "blocking (a failure fails hwprobe-smoke): ${blocking:-(none)}"
          echo "advisory (reported, non-blocking):        ${advisory:-(none)}"
          echo "excluded (not run):                       ${excluded:-(none)}"
          echo "blocking=${blocking}" >> "$GITHUB_OUTPUT"
          echo "advisory=${advisory}" >> "$GITHUB_OUTPUT"
          [ -n "${blocking}${advisory}" ] || { echo "FATAL: matrix derived zero runnable devices from platform data" >&2; exit 1; }

      # --network none on the RUN: baked, pinned artifacts, no out-of-band input needed.
      # The elevated caps mirror E5 sim-gate.yml — SYS_ADMIN + unconfined apparmor/seccomp
      # are required by the nested bwrap sandbox + uinput/evdev seam. See docker/README.md
      # in the sim repo for the tsp-qc1.2 verdict on the required cap set.
      - name: check-control (BLOCKING devices; pf-hwprobe.arm64, qemu launcher only)
        if: steps.matrix.outputs.blocking != ''
        run: |
          docker run --rm --network none \
            --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            -v "$PWD/build:/pf-hwprobe-build:ro" \
            -e APP_ARM64=/pf-hwprobe-build/pf-hwprobe.arm64 \
            "$SIM_IMG" check-control --only-launcher qemu --label pf-hwprobe ${{ steps.matrix.outputs.blocking }}

      # ADVISORY devices report but do not fail the required check (infra-113 D2 — a523 rides as
      # device-free data, not a hardware gate). A failure here is surfaced loudly, never silenced.
      - name: check-control (ADVISORY devices; reported, non-blocking)
        if: steps.matrix.outputs.advisory != ''
        run: |
          if docker run --rm --network none \
            --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            -v "$PWD/build:/pf-hwprobe-build:ro" \
            -e APP_ARM64=/pf-hwprobe-build/pf-hwprobe.arm64 \
            "$SIM_IMG" check-control --only-launcher qemu --label pf-hwprobe ${{ steps.matrix.outputs.advisory }}; then
            echo "✓ advisory devices passed: ${{ steps.matrix.outputs.advisory }}"
          else
            echo "::warning title=advisory sim smoke failed::advisory devices FAILED (reported, non-blocking): ${{ steps.matrix.outputs.advisory }}"
          fi

      - name: Cleanup CI image
        if: always()
        run: docker image rm -f "$SIM_IMG" || true

      # Defense-in-depth vs root-owned leftovers (bead tsp-u3e4): build.sh's
      # containers now chown their outputs back to the invoking user, but if a
      # build dies mid-container (or a future step regresses), root-owned files
      # in the workspace wedge the NEXT run's actions/checkout (EACCES rmdir —
      # exactly how every smoke run 2026-07-12..16 went red). The runner user
      # has no general sudo, so reclaim ownership via docker instead. Never
      # fails the job: it's a sweep, not a gate.
      - name: Reclaim workspace ownership (prevent runner-workdir wedge)
        if: always()
        run: |
          docker run --rm -v "$PWD:/w" debian:bookworm chown -R "$(id -u):$(id -g)" /w || true
